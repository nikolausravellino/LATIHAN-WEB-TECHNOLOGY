<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Sederhana</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      max-width: 900px;
      width: 100%;
    }

    /* HEADER */
    header {
      background-color: #ffe4b5;
      text-align: center;
      padding: 15px;
      font-weight: bold;
      border-top: 1px solid orange;
      border-left: 1px solid orange;
      border-right: 1px solid orange;
      border-bottom: 1px solid blue;
    }

    /* NAVIGASI */
    nav {
      background-color: #dbe9ff;
      text-align: center;
      padding: 15px;
      font-weight: bold;
      border-left: 1px solid blue;
      border-right: 1px solid blue;
      border-bottom: 1px solid red;
    }

    /* KONTEN DAN MENU */
    .container {
      display: flex;
      min-height: 250px;
    }

    .content {
      flex: 5;
      background-color: #f8d7da;
      padding: 30px 40px;
      text-align: left;
      border-left: 1px solid red;     /* kiri merah */
      border-right: 1px solid green;  /* kanan hijau */
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
      margin-top: 30px;
    }

    p {
      margin: 0 0 10px 0;
      font-size: 15px;
      line-height: 1.3;
      max-width: 500px;
    }

    /* MENU */
    aside {
      background-color: #D5F5E3;
      min-height: 250px;
      width: 150px;
      padding: 20px;
      text-align: left;
      border: 1px solid green; /* semua sisi hijau */
    }
    aside strong {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    aside ul {
      margin: 0;
      padding-left: 20px;
      list-style-type: disc;
    }

    /* FOOTER */
    footer {
      background-color: #ffe4b5;
      text-align: center;
      padding: 15px;
      font-weight: bold;
      border: 2px solid orange;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      HEADER
    </header>

    <nav>
      NAVIGASI
    </nav>

    <div class="container">
      <div class="content">
        <h1>Heading 1</h1>
        <p>Lorem ipsum dolor sit amet, consectetur</p>
        <p>Adipiscing elit, sed do eiusmod tempor</p>
        <p>Incididunt ut labore et dolore magna aliqua.</p>
      </div>

      <aside>
        <strong>Menu:</strong>
        <ul>
          <li>Home</li>
          <li>Berita</li>
          <li>Layanan</li>
          <li>Kontak</li>
        </ul>
      </aside>
    </div>

    <footer>
      FOOTER
    </footer>
  </div>
</body>
</html>
