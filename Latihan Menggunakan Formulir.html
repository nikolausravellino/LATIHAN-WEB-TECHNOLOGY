<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir dengan Scroll</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .form-container {
      width: 400px;
      height: 200px;
      border: 1px solid #000;
      padding: 15px;
      overflow: auto;
    }

    .form-group {
      display: flex;
      margin-bottom: 10px;
      align-items: flex-start;
    }

    .form-group label {
      width: 80px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      flex: 1;
      padding: 5px;
      border: 1px solid #666;
    }

    textarea {
      height: 80px;
      resize: none;
      overflow-y: scroll;   /* scrollbar vertikal selalu muncul */
      overflow-x: hidden;   /* cegah horizontal */
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="you name here">
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="your email here">
    </div>
    <div class="form-group">
      <label for="address">Address:</label>
      <textarea id="address" name="address" placeholder="25 Nowhere Street&#10;Somewhere&#10;Not Here&#10;Y2K 5RU"></textarea>
    </div>
    <div class="form-group">
      <label for="postcode">Postcode:</label>
      <input type="text" id="postcode" name="postcode" placeholder="postal code">
    </div>
  </div>

</body>
</html>
